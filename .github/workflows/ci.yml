name: ci

on:
  push:
    branches: [master, main, develop]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  self-scan:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci && npm run build
      # Install the scanners this job needs, then gate the build on findings.
      - run: ./scripts/install-tools.sh semgrep trivy gitleaks || true
      - name: sec-scan (static) with SARIF output
        run: node dist/cli/src/index.js scan . --only sast,sca,secrets --format sarif --out sec-scan.sarif || true
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sec-scan.sarif
        continue-on-error: true
      - name: Fail the build over the severity threshold
        run: node dist/cli/src/index.js ci . --only sast,sca,secrets --fail-on high
